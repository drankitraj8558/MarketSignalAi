name: Market AI Scanner

on:
  schedule:
    # Runs Monday to Friday automatically at 10:00 AM IST (04:30 UTC) and 3:45 PM IST (10:15 UTC)
    - cron: '30 4 * * 1-5'
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install yfinance pandas requests google-genai pytz

      - name: Execute Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scanner.py

      - name: Commit and Push Updated Signal Feed
        run: |
          git config --global user.name "Market AI Agent"
          git config --global user.email "agent@github.com"
          git add signals.json
          git diff --staged --quiet || git commit -m "Auto-update market signals [skip ci]"
          git push
