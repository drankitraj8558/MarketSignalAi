<script type="text/javascript">
  let currentWidget = null;

  function loadTicker(symbol) {
    document.getElementById('tradingview_widget').innerHTML = '';
    currentWidget = new TradingView.widget({
      "autosize": true,
      "symbol": symbol,
      "interval": "D",
      "timezone": "Asia/Kolkata",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#121824",
      "enable_publishing": false,
      "hide_side_toolbar": false,
      "allow_symbol_change": true,
      "container_id": "tradingview_widget"
    });
  }

  loadTicker("NSE:RELIANCE");

  async function loadLiveSignals() {
    try {
      const res = await fetch('./signals.json?t=' + new Date().getTime());
      if (!res.ok) return;
      const data = await res.json();
      const feed = document.getElementById('signal-feed');
      
      if (!data.signals || data.signals.length === 0) {
        feed.innerHTML = '<p class="text-xs text-gray-500">No active breakout/rebound setups right now.</p>';
        return;
      }

      feed.innerHTML = data.signals.map(s => `
        <div class="p-3 bg-[#182234] border-l-4 border-emerald-500 rounded-r-lg mb-3">
          <div class="flex justify-between items-center text-xs font-bold">
            <span class="text-emerald-400">🟢 BUY SETUP: ${s.ticker}</span>
            <span class="text-gray-400 font-normal">${s.time}</span>
          </div>
          <p class="text-xs text-gray-300 mt-1 font-mono">Price: ₹${s.price} | RSI: ${s.rsi}</p>
          <p class="text-xs text-gray-400 mt-1 leading-relaxed">${s.analysis}</p>
        </div>
      `).join('');
    } catch (e) {
      console.log("Awaiting feed update...");
    }
  }

  loadLiveSignals();
</script>
