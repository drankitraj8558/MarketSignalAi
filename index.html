<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradePulse Pro AI | Live Market Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0e14; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 4px; }
  </style>
</head>
<body class="p-3 md:p-6">

  <!-- Header -->
  <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 pb-4 border-b border-gray-800 gap-3">
    <div>
      <h1 class="text-xl md:text-2xl font-black tracking-tight text-white flex items-center gap-2">
        <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        TradePulse Pro AI
      </h1>
      <p class="text-xs text-gray-400 mt-0.5">Automated 15-Stock Screener (RSI, 200 EMA, MACD, Volume Spikes)</p>
    </div>
    <div class="flex items-center gap-2.5">
      <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-3 py-1 rounded-full font-mono font-medium">● 15 Stocks Tracked</span>
      <button onclick="loadLiveSignals()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-md font-medium transition">Sync Signals</button>
    </div>
  </header>

  <!-- 15-Stock Horizontal Watchlist Bar -->
  <div class="mb-4 bg-[#121824] p-2.5 rounded-xl border border-gray-800">
    <div class="text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-2 px-1">Watchlist Quick-Switch (15 Stocks):</div>
    <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs">
      <button onclick="loadChart('BSE:RELIANCE')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">RELIANCE</button>
      <button onclick="loadChart('BSE:TCS')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">TCS</button>
      <button onclick="loadChart('BSE:INFY')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">INFY</button>
      <button onclick="loadChart('BSE:HDFCBANK')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">HDFCBANK</button>
      <button onclick="loadChart('BSE:ICICIBANK')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">ICICI</button>
      <button onclick="loadChart('BSE:SBIN')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">SBIN</button>
      <button onclick="loadChart('BSE:BHARTIARTL')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">AIRTEL</button>
      <button onclick="loadChart('BSE:ITC')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">ITC</button>
      <button onclick="loadChart('BSE:LT')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">LT</button>
      <button onclick="loadChart('BSE:TATAMOTORS')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">TATAMOTORS</button>
      <button onclick="loadChart('BSE:BAJFINANCE')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">BAJAJ-FIN</button>
      <button onclick="loadChart('BSE:MARUTI')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">MARUTI</button>
      <button onclick="loadChart('BSE:AXISBANK')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">AXIS</button>
      <button onclick="loadChart('BSE:SUNPHARMA')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">SUNPHARMA</button>
      <button onclick="loadChart('BSE:KOTAKBANK')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-200 shrink-0">KOTAK</button>
    </div>
  </div>

  <!-- Main Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Left: Live Interactive Chart (BSE Unblocked Embed) -->
    <div class="lg:col-span-2 bg-[#121824] rounded-xl border border-gray-800 p-4 flex flex-col h-[560px]">
      <div class="flex justify-between items-center mb-3">
        <h2 id="chart-title" class="text-xs font-bold uppercase tracking-wider text-emerald-400 font-mono">BSE:RELIANCE</h2>
        <span class="text-[10px] text-gray-500 font-mono">Tap any signal below to load chart</span>
      </div>
      
      <div class="flex-grow w-full rounded-lg overflow-hidden border border-gray-800/60 relative">
        <iframe 
          id="tv-iframe"
          src="https://s.tradingview.com/widgetembed/?symbol=BSE%3ARELIANCE&interval=D&hidesidetoolbar=0&symboledit=1&saveimage=1&toolbarbg=121824&studies=%5B%5D&theme=dark&style=1&timezone=Asia%2FKolkata&withdateranges=1&showpopupbutton=1"
          style="width: 100%; height: 100%; border: none;">
        </iframe>
      </div>
    </div>

    <!-- Right: Signals Feed & Gauge -->
    <div class="flex flex-col gap-6">
      
      <!-- Live Signals Feed -->
      <div class="bg-[#121824] rounded-xl border border-gray-800 p-4">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-gray-300">Triggered AI Signals</h2>
          <span id="update-time" class="text-[10px] text-gray-500 font-mono">Syncing...</span>
        </div>
        <div class="space-y-2.5 max-h-[250px] overflow-y-auto pr-1" id="signal-feed">
          <p class="text-xs text-gray-500">Loading latest scans...</p>
        </div>
      </div>

      <!-- Technical Meter -->
      <div class="bg-[#121824] rounded-xl border border-gray-800 p-4 h-[250px] flex flex-col">
        <h2 class="text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">Market Sentiment Gauge (NIFTY 50)</h2>
        <div class="flex-grow w-full overflow-hidden">
          <iframe 
            src="https://s.tradingview.com/embed-widget/technical-analysis/?locale=en#%7B%22interval%22%3A%221D%22%2C%22width%22%3A%22100%25%22%2C%22isTransparent%22%3Atrue%2C%22height%22%3A%22100%25%22%2C%22symbol%22%3A%22NSE%3ANIFTY%22%2C%22showIntervalTabs%22%3Atrue%2C%22displayMode%22%3A%22single%22%2C%22colorTheme%22%3A%22dark%22%7D" 
            style="width: 100%; height: 100%; border: none;">
          </iframe>
        </div>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script type="text/javascript">
    function loadChart(symbol) {
      document.getElementById('chart-title').innerText = symbol;
      const encodedSymbol = encodeURIComponent(symbol);
      document.getElementById('tv-iframe').src = 
        `https://s.tradingview.com/widgetembed/?symbol=${encodedSymbol}&interval=D&hidesidetoolbar=0&symboledit=1&saveimage=1&toolbarbg=121824&studies=%5B%5D&theme=dark&style=1&timezone=Asia%2FKolkata&withdateranges=1&showpopupbutton=1`;
    }

    async function loadLiveSignals() {
      try {
        const res = await fetch('./signals.json?t=' + new Date().getTime());
        if (!res.ok) return;
        const data = await res.json();
        
        if (data.last_updated) {
          document.getElementById('update-time').innerText = data.last_updated;
        }

        const feed = document.getElementById('signal-feed');
        if (!data.signals || data.signals.length === 0) {
          feed.innerHTML = '<p class="text-xs text-gray-500">No active breakout/rebound setups triggered.</p>';
          return;
        }

        feed.innerHTML = data.signals.map(s => {
          const isBuy = s.type === "BUY";
          const borderClass = isBuy ? "border-emerald-500" : "border-rose-500";
          const badgeClass = isBuy ? "text-emerald-400 bg-emerald-950/60" : "text-rose-400 bg-rose-950/60";
          const cleanTicker = s.ticker.replace('.NS', '');

          return `
            <div onclick="loadChart('BSE:${cleanTicker}')" class="p-3 bg-[#161f2e] hover:bg-[#1c283c] cursor-pointer border-l-4 ${borderClass} rounded-r-lg transition">
              <div class="flex justify-between items-center text-xs font-bold">
                <span class="${badgeClass} px-2 py-0.5 rounded font-mono">${isBuy ? '🟢 BUY' : '🔴 EXIT'}: ${cleanTicker}</span>
                <span class="text-gray-400 font-normal text-[10px]">${s.time.split(',')[1] || s.time}</span>
              </div>
              <div class="flex gap-3 text-[11px] text-gray-300 font-mono mt-1.5">
                <span>₹${s.price}</span>
                <span>RSI: ${s.rsi}</span>
                <span>${s.indicators || ''}</span>
              </div>
              <p class="text-xs text-gray-400 mt-1 text-[11px] leading-snug">${s.analysis}</p>
            </div>
          `;
        }).join('');
      } catch (e) {
        console.log("Awaiting sync...");
      }
    }

    loadLiveSignals();
  </script>
</body>
</html>
